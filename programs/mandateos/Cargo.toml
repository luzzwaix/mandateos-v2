[package]
name = "mandateos"
version = "0.1.0"
description = "MandateOS recursive capital authority"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mandateos"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token"] }

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 440 480" role="img" aria-labelledby="title description">
  <title id="title">ONE CUT — mobile authority illustration</title>
  <desc id="description">Root Treasury delegates to Research and independently to Operations. Research is revoked at a single cut. Data and Scraper remain locally Active but their effective authority is Blocked. Operations remains connected to Root and Active. Illustration only, not transaction evidence.</desc>
  <defs>
    <marker id="blocked" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 4L1 7" fill="none" stroke="#c39b92" stroke-width="2"/></marker>
    <marker id="active" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7d8bd" stroke-width="2"/></marker>
  </defs>
  <rect x="1" y="1" width="438" height="478" rx="18" fill="#111918" stroke="#34423f" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="24" y="164" width="142" height="76" rx="12" fill="#ece8dd" stroke="#b8a7ce" stroke-width="2"/>
    <text x="95" y="195" fill="#17201e" font-size="28" font-weight="700" text-anchor="middle">ROOT</text>
    <text x="95" y="224" fill="#394640" font-size="18" text-anchor="middle">Treasury</text>
    <path d="M166 188H188C210 188 210 82 232 82" fill="none" stroke="#d79b96" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#blocked)"/>
    <circle cx="210" cy="135" r="14" fill="#111918"/>
    <path d="M201 126L219 144M219 126L201 144" fill="none" stroke="#e5aea7" stroke-width="3" stroke-linecap="round"/>
    <rect x="232" y="44" width="184" height="76" rx="10" fill="#2b211f" stroke="#b17c76" stroke-width="2"/>
    <text x="252" y="76" fill="#eee9df" font-size="26" font-weight="600">Research</text>
    <text x="252" y="104" fill="#e5aea7" font-size="20" font-weight="600">REVOKED</text>
    <path d="M324 120V184" fill="none" stroke="#aa8981" stroke-width="3" stroke-dasharray="5 6" marker-end="url(#blocked)"/>
    <rect x="232" y="184" width="184" height="76" rx="10" fill="#17201e" stroke="#53625a"/>
    <text x="252" y="216" fill="#eee9df" font-size="26" font-weight="600">Data</text>
    <text x="252" y="244" fill="#d8b8af" font-size="20" font-weight="600">BLOCKED</text>
    <path d="M324 260V324" fill="none" stroke="#aa8981" stroke-width="3" stroke-dasharray="5 6" marker-end="url(#blocked)"/>
    <rect x="232" y="324" width="184" height="76" rx="10" fill="#17201e" stroke="#53625a"/>
    <text x="252" y="356" fill="#eee9df" font-size="26" font-weight="600">Scraper</text>
    <text x="252" y="384" fill="#d8b8af" font-size="20" font-weight="600">BLOCKED</text>
    <path d="M95 240V324" fill="none" stroke="#b7d8bd" stroke-width="4" marker-end="url(#active)"/>
    <rect x="24" y="324" width="164" height="76" rx="10" fill="#192b23" stroke="#8eb797" stroke-width="2"/>
    <text x="44" y="356" fill="#eee9df" font-size="24" font-weight="600">Operations</text>
    <text x="44" y="384" fill="#c3e2c8" font-size="20" font-weight="600">ACTIVE</text>
    <text x="24" y="444" fill="#c9d1c6" font-size="17">Blocked descendants retain local Active.</text>
    <text x="24" y="468" fill="#b9c4bd" font-size="14">ILLUSTRATION · NO TRANSACTIONS</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="402" viewBox="0 0 1012 402" role="img" aria-labelledby="title description">
  <title id="title">ONE CUT — revoke a branch, preserve independent authority</title>
  <desc id="description">Root Treasury delegates to Research and independently to Operations. A single cut revokes Research. Its Data and Scraper descendants remain locally Active but are effectively Blocked. Operations stays connected to Root and Active. Semantic illustration only; no new transaction or execution is represented.</desc>
  <defs>
    <marker id="blocked" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 4L1 7" fill="none" stroke="#c39b92" stroke-width="2"/></marker>
    <marker id="active" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 4L1 7" fill="none" stroke="#b7d8bd" stroke-width="2"/></marker>
  </defs>
  <rect x="1" y="1" width="1010" height="400" rx="20" fill="#111918" stroke="#34423f" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- One authority source; the lower branch never passes through Research. -->
    <rect x="32" y="148" width="164" height="102" rx="14" fill="#ece8dd" stroke="#b8a7ce" stroke-width="2"/>
    <text x="114" y="194" fill="#17201e" font-size="34" font-weight="700" text-anchor="middle">ROOT</text>
    <text x="114" y="226" fill="#394640" font-size="20" text-anchor="middle">Treasury</text>
    <path d="M196 182H214C246 182 246 106 270 106H286" fill="none" stroke="#d79b96" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#blocked)"/>
    <!-- Single cut: the link remains structurally recorded but is invalid authority. -->
    <circle cx="244" cy="144" r="17" fill="#111918"/>
    <path d="M233 133L255 155M255 133L233 155" fill="none" stroke="#e5aea7" stroke-width="4" stroke-linecap="round"/>
    <rect x="286" y="54" width="202" height="104" rx="12" fill="#2b211f" stroke="#b17c76" stroke-width="2"/>
    <text x="310" y="96" fill="#eee9df" font-size="28" font-weight="600">Research</text>
    <text x="310" y="136" fill="#e5aea7" font-size="20" font-weight="600">REVOKED</text>
    <path d="M488 106H532" fill="none" stroke="#aa8981" stroke-width="3" stroke-dasharray="5 6" marker-end="url(#blocked)"/>
    <rect x="532" y="54" width="202" height="104" rx="12" fill="#17201e" stroke="#53625a"/>
    <text x="556" y="96" fill="#eee9df" font-size="28" font-weight="600">Data</text>
    <text x="556" y="136" fill="#d8b8af" font-size="20" font-weight="600">BLOCKED</text>
    <path d="M734 106H778" fill="none" stroke="#aa8981" stroke-width="3" stroke-dasharray="5 6" marker-end="url(#blocked)"/>
    <rect x="778" y="54" width="202" height="104" rx="12" fill="#17201e" stroke="#53625a"/>
    <text x="802" y="96" fill="#eee9df" font-size="28" font-weight="600">Scraper</text>
    <text x="802" y="136" fill="#d8b8af" font-size="20" font-weight="600">BLOCKED</text>
    <text x="286" y="202" fill="#c9d1c6" font-size="20">Data + Scraper: local Active · effective Blocked</text>
    <path d="M196 222H226C250 222 250 297 274 297H532" fill="none" stroke="#b7d8bd" stroke-width="4" marker-end="url(#active)"/>
    <rect x="532" y="250" width="448" height="94" rx="12" fill="#192b23" stroke="#8eb797" stroke-width="2"/>
    <text x="558" y="288" fill="#eee9df" font-size="28" font-weight="600">Operations</text>
    <text x="876" y="288" fill="#c3e2c8" font-size="20" font-weight="600">ACTIVE</text>
    <text x="558" y="322" fill="#bed0be" font-size="20">Independent Root branch</text>
    <text x="32" y="378" fill="#b9c4bd" font-size="16">AUTHORITY ILLUSTRATION · NO TRANSACTIONS</text>
  </g>
</svg>
